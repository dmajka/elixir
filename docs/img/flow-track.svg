<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 726" width="480" height="726" role="img" aria-label="Signal flow of one track: source, filter, amp EG, shape, sample rate, bits and tilt, insert FX, cross mod and choke, volume and pan, then dry, FX send, delay send and reverb send">
<title>Signal flow of one track: source, filter, amp EG, shape, sample rate, bits and tilt, insert FX, cross mod and choke, volume and pan, then dry, FX send, delay send and reverb send</title>
<style>
.bx { fill: #fcf8ef; stroke: #cdbb98; stroke-width: 1.2; }
.bx.k { fill: #f3e6cb; }
.md { fill: #f6f0e3; stroke: #cdbb98; stroke-width: 1.2; stroke-dasharray: 4 3; }
.t { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #2a241b; letter-spacing: .04em; }
.d { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #5e5649; }
.p { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #a85f00; letter-spacing: .06em; text-anchor: end; }
.c { text-anchor: middle; }
.a { stroke: #a85f00; stroke-width: 1.6; fill: none; }
.a.m { stroke-dasharray: 3 3; stroke-width: 1.2; }
.h { fill: #a85f00; }
@media (prefers-color-scheme: dark) {
  .bx { fill: #1a1713; stroke: #4a4135; } .bx.k { fill: #2a2318; } .md { fill: #15130f; stroke: #4a4135; }
  .t { fill: #ece4d3; } .d { fill: #b3aa99; } .p { fill: #f5b04f; } .a { stroke: #f5b04f; } .h { fill: #f5b04f; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bx" x="20" y="16" width="332" height="58" rx="7"/><text class="t" x="32" y="36">SOURCE</text><text class="d" x="32" y="53">Oscillator, FM and transient, or a model:</text><text class="d" x="32" y="68">Rings, Plaits, MICRO or ENSEMBLE</text><text class="p" x="342" y="36">EDIT</text>
<rect class="bx" x="20" y="92" width="332" height="58" rx="7"/><text class="t" x="32" y="112">FILTER</text><text class="d" x="32" y="129">the LXR&#x27;s types, LP4, combs, vowel, chord …;</text><text class="d" x="32" y="144">ACID, MS20, LADDER (FILTER X: env amt)</text><text class="p" x="342" y="112">SCL</text>
<path class="a" d="M186.0 74 V91" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="168" width="332" height="58" rx="7"/><text class="t" x="32" y="188">AMP EG</text><text class="d" x="32" y="205">Attack, decay, slope; GATE holds it for</text><text class="d" x="32" y="220">the note&#x27;s length</text><text class="p" x="342" y="188">ENV</text>
<path class="a" d="M186.0 150 V167" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="244" width="332" height="58" rx="7"/><text class="t" x="32" y="264">SHAPE</text><text class="d" x="32" y="281">The waveshaper Drive goes into: LXR,</text><text class="d" x="32" y="296">FOLD, CLIP, FUZZ, TAPE, BITE …</text><text class="p" x="342" y="264">SCL</text>
<path class="a" d="M186.0 226 V243" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="320" width="332" height="58" rx="7"/><text class="t" x="32" y="340">SAMPLE RATE · BITS · TILT</text><text class="d" x="32" y="357">The rate reducer, the bitcrusher and</text><text class="d" x="32" y="372">a one-knob EQ</text><text class="p" x="342" y="340">SCL</text>
<path class="a" d="M186.0 302 V319" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="396" width="332" height="58" rx="7"/><text class="t" x="32" y="416">INSERT FX</text><text class="d" x="32" y="433">Phaser, flanger, chorus, tremolo,</text><text class="d" x="32" y="448">autopan, shifter or ring</text><text class="p" x="342" y="416">SCL</text>
<path class="a" d="M186.0 378 V395" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="472" width="332" height="58" rx="7"/><text class="t" x="32" y="492">CROSS MOD · CHOKE</text><text class="d" x="32" y="509">Another voice ducks it or rings it; a hit</text><text class="d" x="32" y="524">in its choke group cuts it short</text><text class="p" x="342" y="492">LFO</text>
<path class="a" d="M186.0 454 V471" marker-end="url(#ah)"/>
<rect class="bx" x="20" y="548" width="332" height="58" rx="7"/><text class="t" x="32" y="568">VOLUME · PAN</text><text class="d" x="32" y="585">The mixer&#x27;s level and place</text><text class="p" x="342" y="568">GLO</text>
<path class="a" d="M186.0 530 V547" marker-end="url(#ah)"/>
<rect class="md" x="374" y="16" width="86" height="590" rx="7"/>
<text class="t" x="384" y="36">MOD</text>
<text class="d" x="384" y="60">LFO 1</text>
<text class="d" x="384" y="77">LFO 2</text>
<text class="d" x="384" y="94">Mod EG</text>
<text class="d" x="384" y="111">Velocity</text>
<text class="d" x="384" y="128">Random</text>
<text class="d" x="384" y="145">  per hit</text>
<text class="d" x="384" y="162">Step locks</text>
<text class="d" x="384" y="179">Global LFOs</text>
<text class="d" x="384" y="196">Morph</text>
<text class="d" x="384" y="213"></text>
<text class="d" x="384" y="230">move the</text>
<text class="d" x="384" y="247">knobs on</text>
<text class="d" x="384" y="264">the left</text>
<path class="a m" d="M372 45.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 121.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 197.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 273.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 349.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 425.0 H355" marker-end="url(#ah)"/>
<path class="a m" d="M372 501.0 H355" marker-end="url(#ah)"/>
<path class="a" d="M186.0 606 V624"/>
<path class="a" d="M70 624 H409"/>
<path class="a" d="M70 624 V643" marker-end="url(#ah)"/>
<rect class="bx k" x="20" y="644" width="101" height="66" rx="7"/><text class="t c" x="70.5" y="664">DRY</text><text class="d c" x="70.5" y="681">to the mix</text>
<path class="a" d="M183 624 V643" marker-end="url(#ah)"/>
<rect class="bx k" x="133" y="644" width="101" height="66" rx="7"/><text class="t c" x="183.5" y="664">FX SEND</text><text class="d c" x="183.5" y="681">to the FX bus,</text><text class="d c" x="183.5" y="696">in place of dry</text>
<path class="a" d="M296 624 V643" marker-end="url(#ah)"/>
<rect class="bx k" x="246" y="644" width="101" height="66" rx="7"/><text class="t c" x="296.5" y="664">DLY SEND</text><text class="d c" x="296.5" y="681">to the delay,</text><text class="d c" x="296.5" y="696">on top of dry</text>
<path class="a" d="M409 624 V643" marker-end="url(#ah)"/>
<rect class="bx k" x="359" y="644" width="101" height="66" rx="7"/><text class="t c" x="409.5" y="664">REV SEND</text><text class="d c" x="409.5" y="681">to the reverb,</text><text class="d c" x="409.5" y="696">on top of dry</text>
</svg>
